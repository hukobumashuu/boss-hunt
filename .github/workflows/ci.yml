name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boss_tracker
          POSTGRES_PASSWORD: boss_tracker
          POSTGRES_DB: boss_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boss_tracker -d boss_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://boss_tracker:boss_tracker@localhost:5432/boss_tracker_test
      ALLOWED_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"
      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Run server checks
        working-directory: server
        run: |
          bun run typecheck
          bun run lint
          bun run format:check
          bun run db:migrate
          bun test
      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Build client
        working-directory: client
        env:
          VITE_API_URL: https://example.invalid
        run: bun run build
