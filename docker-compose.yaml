services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boss_tracker
      POSTGRES_PASSWORD: boss_tracker
      POSTGRES_DB: boss_tracker
    ports:
      - "5433:5432" # 5433 to avoid clashing with another local Postgres (e.g. job-application-tracker on 5432)
    volumes:
      - boss_tracker_data:/var/lib/postgresql/data

volumes:
  boss_tracker_data:
