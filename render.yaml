services:
  - type: web
    name: boss-tracker-api
    runtime: node
    rootDir: server
    buildCommand: bun install --frozen-lockfile && bun run db:migrate
    startCommand: bun src/server.ts
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUN_VERSION
        value: 1.4.1
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
